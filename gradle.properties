# Reuse the configured task graph while the build scripts and their inputs are unchanged.
org.gradle.configuration-cache=true

# Temporary override of the Jackson 3 version that the Spring Boot BOM manages, as in Coffee Kitty.
# io.spring.dependency-management uses a project property named like a BOM property in place of the BOM's value.
# Spring Boot 4.1.2 brings jackson-databind 3.1.7, whose PolymorphicTypeValidator accepts any class named in a generic
# type argument or an array element type of a class-name type ID (GHSA-m8xf-2cr7-77ph). The patch release 3.1.8 fixes
# it. Delete this line once the Spring Boot version in build.gradle.kts manages 3.1.8 or newer.
jackson-bom.version=3.1.8
