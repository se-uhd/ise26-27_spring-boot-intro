# Gradle caches the task graph and reuses it in later builds while the build scripts and their inputs are unchanged.
org.gradle.configuration-cache=true

# Overrides the Jackson 3 version that the Spring Boot BOM manages. If a project property has the same name as a BOM
# property, io.spring.dependency-management uses the project property in place of the BOM value.
# Spring Boot 4.1.2 manages jackson-databind 3.1.7, in which the PolymorphicTypeValidator accepts any class that appears
# as a generic type argument or as an array element type in a class-name type ID (GHSA-m8xf-2cr7-77ph). Jackson 3.1.8
# fixes this vulnerability. Delete this line once the Spring Boot version in build.gradle.kts manages 3.1.8 or newer.
jackson-bom.version=3.1.8
